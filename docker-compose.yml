services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orvolt}
      POSTGRES_USER: ${POSTGRES_USER:-orvolt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orvolt_dev_only}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats-data:/data

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  control-plane:
    build:
      context: .
      dockerfile: cloud/control-plane/Dockerfile
    environment:
      POSTGRES_DSN: postgres://${POSTGRES_USER:-orvolt}:${POSTGRES_PASSWORD:-orvolt_dev_only}@postgres:5432/${POSTGRES_DB:-orvolt}?sslmode=disable
      NATS_URL: nats://nats:4222
      NATS_SUBJECT: orvolt.telemetry.evse.v1
      ENERGY_NATS_SUBJECT: orvolt.energy.site.v1
      HTTP_ADDR: :8080
      # Bounded streams: an unbounded JetStream store eventually fills the
      # broker's disk, at which point the whole fleet stops publishing.
      STREAM_MAX_AGE: ${STREAM_MAX_AGE:-720h}
      STREAM_MAX_BYTES: ${STREAM_MAX_BYTES:-8589934592}
      INGEST_BATCH_SIZE: ${INGEST_BATCH_SIZE:-256}
      INGEST_BATCH_INTERVAL: ${INGEST_BATCH_INTERVAL:-250ms}
      STATION_SILENCE_AFTER: ${STATION_SILENCE_AFTER:-5m}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

  edge-agent:
    build:
      context: .
      dockerfile: edge/orvolt-edge-agent/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: orvolt/simulators/evse/telemetry
      NATS_URL: nats://nats:4222
      NATS_SUBJECT: orvolt.telemetry.evse.v1
      EDGE_ID: edge-dev-001
      SITE_ID: site-dev-001
      SPOOL_DIR: /var/lib/orvolt/spool
      OBSERVABILITY_ADDR: 0.0.0.0:9090
    ports:
      - "9090:9090"
    volumes:
      # The spool is the reason a link outage does not lose readings, so it must
      # be persistent storage rather than the container's writable layer.
      - edge-spool:/var/lib/orvolt/spool
    depends_on:
      nats:
        condition: service_started
      mosquitto:
        condition: service_started
    restart: unless-stopped

  evse-simulator:
    build:
      context: .
      dockerfile: simulator/evse-simulator/Dockerfile
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: "1883"
      MQTT_TOPIC: orvolt/simulators/evse/telemetry
      STATION_ID: orvolt-sim-001
      CONNECTOR_ID: "1"
    depends_on:
      mosquitto:
        condition: service_started
    restart: on-failure

volumes:
  nats-data:
  postgres-data:
  edge-spool:
