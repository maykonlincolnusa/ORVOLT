# Containment, not authorization: the management API has no authentication yet,
# so restricting who can reach it is the only control available.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: control-plane
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
---
# The gateway must stay reachable from the public internet: that is where the
# chargers are. Its health port must not be.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ocpp-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ocpp-gateway
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8887
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8081
