apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: orvolt

resources:
  - namespace.yaml
  - config.yaml
  - control-plane.yaml
  - ocpp-gateway.yaml
  - network-policy.yaml

# secret.example.yaml is intentionally not listed: real secrets are created out
# of band so they never reach the repository.

commonLabels:
  app.kubernetes.io/part-of: orvolt
