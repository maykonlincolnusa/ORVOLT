# Template only. Do not commit real values; create the Secret out of band, or
# from a sealed-secret / external-secrets source.
#
#   kubectl -n orvolt create secret generic orvolt-secrets \
#     --from-literal=POSTGRES_DSN='postgres://...' \
#     --from-literal=TOKEN_PEPPER="$(openssl rand -hex 32)" \
#     --from-file=nats.creds=./control-plane.creds
apiVersion: v1
kind: Secret
metadata:
  name: orvolt-secrets
type: Opaque
stringData:
  POSTGRES_DSN: "postgres://orvolt:CHANGE_ME@postgres.orvolt.svc:5432/orvolt?sslmode=require"
  # Makes stored card identifiers irreversible. Changing it re-identifies every
  # card in the fleet: treat it as permanent and back it up with the database.
  TOKEN_PEPPER: "CHANGE_ME_AT_LEAST_32_BYTES_OF_RANDOM"
  nats.creds: "CHANGE_ME"
