apiVersion: v1
kind: ConfigMap
metadata:
  name: orvolt-config
data:
  HTTP_ADDR: ":8080"
  NATS_URL: "tls://nats.orvolt.svc:4222"
  NATS_SUBJECT: "orvolt.telemetry.evse.v1"
  ENERGY_NATS_SUBJECT: "orvolt.energy.site.v1"
  SESSION_NATS_SUBJECT: "orvolt.session.evse.v1"
  ADVICE_NATS_SUBJECT: "orvolt.control.advice.v1"

  # Bounded streams. Without limits the broker's disk fills and the whole fleet
  # stops being able to publish.
  STREAM_MAX_AGE: "720h"
  STREAM_MAX_BYTES: "8589934592"
  # Sessions are billing evidence and outlive telemetry by design.
  SESSION_STREAM_MAX_AGE: "8760h"

  INGEST_BATCH_SIZE: "256"
  INGEST_BATCH_INTERVAL: "250ms"
  STATION_SILENCE_AFTER: "5m"

  # Reject telemetry that did not arrive on an authenticated per-device
  # subject. Mandatory for any bus an untrusted network can reach.
  REQUIRE_DEVICE_IDENTITY: "true"

  # Fleet-wide load-management defaults. Per-site values need a station
  # registry, which ORVOLT does not yet have.
  SITE_CAPACITY_KW: "100"
  SITE_SAFETY_MARGIN_KW: "5"
  SITE_FALLBACK_KW: "20"
  ENERGY_OBSERVATION_FRESHNESS: "5m"
  MAX_CONNECTOR_KW: "350"

  # OCPP gateway. deny-all is the only honest answer without an authorization
  # service: allow-all lets anyone who points a charger here charge for free.
  OCPP_LISTEN_PORT: "8887"
  OCPP_LISTEN_PATH: "/ocpp/{ws}"
  AUTHORIZATION_MODE: "deny-all"
  HEARTBEAT_INTERVAL: "5m"
  GATEWAY_ID: "ocpp-gateway-001"
