syntax = "proto3";

package orvolt.telemetry.evse.v1;

option go_package = "github.com/orvolt/orvolt/contracts/gen/go/orvolt/telemetry/evse/v1;evsev1";

// ChargingTelemetry is an immutable observation produced locally by an edge agent.
message ChargingTelemetry {
  string station_id = 1;
  string connector_id = 2;
  int64 timestamp_ms = 3;

  double voltage = 4;
  double current = 5;
  double power_kw = 6;
  double energy_kwh = 7;
  double soc = 8;
  double temperature_c = 9;

  ChargingState state = 10;
  EdgeMetadata edge = 11;
}

message EdgeMetadata {
  string edge_id = 1;
  string site_id = 2;
  int64 received_at_ms = 3;

  // Monotonic counter assigned by the edge agent, restarting at 1 on each
  // process start. Consumers use it to detect gaps and to order observations
  // that share a wall-clock millisecond.
  uint64 sequence = 4;

  // Whether the edge agent believes its wall clock is trustworthy. Chargers
  // routinely boot without a battery-backed RTC and before NTP converges, so
  // timestamp_ms must not be trusted when this is not SYNCHRONIZED.
  ClockSync clock_sync = 5;
}

enum ChargingState {
  CHARGING_STATE_UNSPECIFIED = 0;
  CHARGING_STATE_AVAILABLE = 1;
  CHARGING_STATE_PREPARING = 2;
  CHARGING_STATE_CHARGING = 3;
  CHARGING_STATE_FINISHING = 4;
  CHARGING_STATE_FAULTED = 5;

  // Plugged in and authorized, but no energy is flowing because either the
  // vehicle or the equipment paused it. Collapsing this into CHARGING would
  // make a stalled session look healthy, which is the single most common
  // false-negative in charger monitoring.
  CHARGING_STATE_SUSPENDED = 6;
  CHARGING_STATE_RESERVED = 7;
  CHARGING_STATE_UNAVAILABLE = 8;
}

enum ClockSync {
  CLOCK_SYNC_UNSPECIFIED = 0;
  CLOCK_SYNC_SYNCHRONIZED = 1;
  CLOCK_SYNC_UNSYNCHRONIZED = 2;
}
